<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- Rosetta de pétalos -->
  <g transform="translate(160 70)" stroke="#A87E5A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Capa exterior: 6 pétalos grandes -->
    <g>
      <path d="M 0,-50 C 14,-36 18,-18 0,-8 C -18,-18 -14,-36 0,-50 Z"/>
      <path d="M 0,-50 C 14,-36 18,-18 0,-8 C -18,-18 -14,-36 0,-50 Z" transform="rotate(60)"/>
      <path d="M 0,-50 C 14,-36 18,-18 0,-8 C -18,-18 -14,-36 0,-50 Z" transform="rotate(120)"/>
      <path d="M 0,-50 C 14,-36 18,-18 0,-8 C -18,-18 -14,-36 0,-50 Z" transform="rotate(180)"/>
      <path d="M 0,-50 C 14,-36 18,-18 0,-8 C -18,-18 -14,-36 0,-50 Z" transform="rotate(240)"/>
      <path d="M 0,-50 C 14,-36 18,-18 0,-8 C -18,-18 -14,-36 0,-50 Z" transform="rotate(300)"/>
    </g>
    <!-- Capa interior: 6 pétalos pequeños rotados 30° -->
    <g transform="rotate(30)">
      <path d="M 0,-26 C 7,-18 9,-9 0,-3 C -9,-9 -7,-18 0,-26 Z"/>
      <path d="M 0,-26 C 7,-18 9,-9 0,-3 C -9,-9 -7,-18 0,-26 Z" transform="rotate(60)"/>
      <path d="M 0,-26 C 7,-18 9,-9 0,-3 C -9,-9 -7,-18 0,-26 Z" transform="rotate(120)"/>
      <path d="M 0,-26 C 7,-18 9,-9 0,-3 C -9,-9 -7,-18 0,-26 Z" transform="rotate(180)"/>
      <path d="M 0,-26 C 7,-18 9,-9 0,-3 C -9,-9 -7,-18 0,-26 Z" transform="rotate(240)"/>
      <path d="M 0,-26 C 7,-18 9,-9 0,-3 C -9,-9 -7,-18 0,-26 Z" transform="rotate(300)"/>
    </g>
    <circle r="3.5" fill="#A87E5A"/>
  </g>

  <!-- Texto PELGY -->
  <text x="160" y="158"
        text-anchor="middle"
        fill="#A87E5A"
        font-family="Playfair Display, Georgia, serif"
        font-size="42"
        font-weight="500"
        letter-spacing="8">PELGY</text>

  <!-- Subtítulo -->
  <text x="160" y="182"
        text-anchor="middle"
        fill="#A87E5A"
        font-family="Inter, system-ui, sans-serif"
        font-size="11"
        font-weight="300"
        letter-spacing="4">Desde 1995</text>
</svg>
